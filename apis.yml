aid: unit
url: https://raw.githubusercontent.com/api-evangelist/unit/refs/heads/main/apis.yml
name: Unit
kind: company
description: Unit is a US Banking-as-a-Service (BaaS) platform that lets companies
  embed banking, cards, and payments into their own products. Its REST API — organized
  around Applications, Customers, Accounts (deposit, credit, wallet/FBO, DACA), Cards,
  Payments (book, ACH, wire, recurring, received, cash deposit), Checks, Card Authorizations,
  Disputes, Transactions, Statements, Tax Forms, Fees & Rewards, Credit repayments,
  Stop Payments, and Webhooks — is authenticated with organization and customer bearer
  tokens and secured with idempotency keys and resource tagging. Unit publishes a public
  OpenAPI 3.0.2 specification (openapi-unit-sdk) and generates official Node, Python,
  Ruby, and Java SDKs from it.
accessModel:
  pricing: freemium
  onboarding: unknown
  trial: false
  try_now: false
  public: false
  label: Freemium
