notes: >-
  Prior repo had 2 generic apis[] entries and no harvested spec. Deepened to
  16 real resource-family API entries backed by 16 verbatim-split OpenAPI
  files harvested from Unit's public OpenAPI. Pricing page (/pricing) returns
  404 and there is no public standalone support page, so those common types
  were omitted rather than invented.
